<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 能力五級</title>
<style>
:root{--paper:#fbfaf7;--ink:#262b33;--muted:#5d6570;--line:#d6d1c7;--panel:#ffffff;--l3:#e07a1f;--ui-bg:#f4f1ea;--ui-ink:#262b33;--ui-line:#cfc9bd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui-bg:#161a20;--ui-ink:#eef1f5;--ui-line:#3a4250}}
:root[data-theme="dark"]{--ui-bg:#161a20;--ui-ink:#eef1f5;--ui-line:#3a4250}
*{box-sizing:border-box}
body{margin:0;background:var(--ui-bg);color:var(--ui-ink);font-family:"Lesson Latin","Lesson TC","Noto Sans","Noto Sans TC","Microsoft JhengHei",sans-serif}
button,select,input{font:inherit}
button,select{background:var(--panel);color:#262b33;border:1px solid var(--ui-line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--l3);outline-offset:2px}
#shell{margin:auto;max-width:1400px;padding:16px}
#viewport{position:relative;overflow:hidden;border-radius:18px;box-shadow:0 18px 60px #0003}
#stage{position:relative;transform-origin:top left;background:var(--paper);color:var(--ink);overflow:hidden}
#stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#d9d3c6 1.2px,transparent 1.3px);background-size:36px 36px;opacity:.55;pointer-events:none}
#eyebrow{position:absolute;left:96px;top:46px;height:34px;font-size:24px;letter-spacing:4px;font-weight:700;color:var(--muted);white-space:nowrap}
#heading{position:absolute;left:96px;top:84px;width:1728px;height:84px;margin:0;font-size:60px;line-height:84px;font-weight:800;white-space:nowrap}
#subheading{position:absolute;left:96px;top:174px;width:1728px;height:48px;margin:0;font-size:32px;line-height:48px;color:var(--muted);white-space:nowrap}
#visual{position:absolute;left:96px;top:244px;width:1728px;height:620px}
#svg{display:block;width:100%;height:100%;overflow:visible}
#svg text{font-family:inherit}
#caption{position:absolute;left:150px;width:1620px;top:884px;height:150px;z-index:3;border-radius:20px;background:#1f2530ee;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 28px;text-align:center;gap:6px}
#caption1{font-size:44px;line-height:1.3;font-weight:600}
#caption2{font-size:36px;line-height:1.3;color:#ffd9a8}
#credit{position:absolute;left:360px;top:300px;width:1200px;height:420px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:30px;border-radius:36px;background:#fff;border:2px solid var(--line)}
#credit .bar{display:flex;gap:12px}#credit .bar i{display:block;width:84px;height:14px;border-radius:7px}
#credit strong{font-size:96px;letter-spacing:14px;font-weight:800}
#credit small{font-size:28px;letter-spacing:6px;color:var(--muted)}
#progress-mark{position:absolute;height:6px;background:var(--l3);left:0;bottom:0}
#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0}
#seek{flex:1;min-width:160px;accent-color:#e07a1f}
#time{font-variant-numeric:tabular-nums;min-width:110px}
.interaction{padding:18px;border:1px solid var(--ui-line);border-radius:14px;background:var(--panel);color:#262b33;display:grid;gap:12px}
.interaction h2{margin:0;font-size:20px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#delay{width:min(420px,100%);accent-color:#e07a1f}
#feedback{margin:0;font-size:18px;line-height:1.6;min-height:3.2em}
#quiz{display:grid;gap:14px;border-top:1px solid #e3dfd6;padding-top:12px}.qitem{display:grid;gap:8px}.qitem p{margin:0}.qitem .q{font-weight:600}.opts{display:flex;gap:8px;flex-wrap:wrap}.qfb{min-height:1.6em}
.note{font-size:13px;opacity:.8}
body.export #shell{padding:0;max-width:none}body.export #viewport{border-radius:0;box-shadow:none}
body.export #controls,body.export .interaction,body.export .note{display:none}
</style>
<div id="shell">
<div id="viewport"><main id="stage" aria-label="教學動畫畫面">
<div id="eyebrow" data-qa data-container="#stage"></div>
<h1 id="heading" data-qa data-container="#stage"></h1>
<p id="subheading" data-qa data-container="#stage"></p>
<div id="visual" data-qa data-container="#stage"><svg id="svg" viewBox="0 0 1728 620" aria-hidden="true"></svg></div>
<div id="credit" data-qa data-container="#stage"><div class="bar"><i style="background:#3b78e7"></i><i style="background:#1f9d68"></i><i style="background:#e07a1f"></i><i style="background:#b89200"></i><i style="background:#a54fd0"></i></div><strong>李振偉老師</strong><small id="creditSub"></small></div>
<div id="caption" data-qa data-container="#stage"><div id="caption1"></div><div id="caption2"></div></div>
<div id="progress-mark"></div>
</main></div>
<nav id="controls" aria-label="播放控制">
<button id="play">播放</button><button id="replay">重播</button>
<input id="seek" type="range" min="0" step="1" value="0" aria-label="播放進度">
<span id="time"></span>
<select id="locale" aria-label="配音語言"><option value="zh-TW">中文配音</option><option value="en-US">English narration</option></select>
<select id="track" aria-label="字幕語言" hidden></select>
<select id="chapters" aria-label="章節"></select>
<button id="captions" aria-pressed="true">字幕開啟</button>
</nav>
<section class="interaction" aria-label="教學互動">
<h2 id="ixTitle"></h2>
<div class="row"><label for="delay" id="ixLabel"></label><input id="delay" type="range" min="1" max="5" step="1" value="1"><strong id="ixLevel"></strong></div>
<p id="feedback" role="status"></p>
<div id="quiz" hidden></div>
</section>
<p class="note" id="note"></p>
</div>

 for(const k in KINDS)R[k].g.style.display=s.kind===k?'':'none';R.ladder.g.style.display=s.ladder&&!(s.ladder.mode==='grow'&&t<s.ladder.grow)?'':'none';R.chrome.g.style.display=CHROME.has(s.kind)?'':'none';
 if(s.ladder)updateLadder(R.ladder,t,s.ladder,s);
 if(KINDS[s.kind])KINDS[s.kind][1](R[s.kind],t,s);
 if(credit){const k=back(span(t,s.start,s.start+.6));$('credit').style.opacity=clamp(k*2);$('credit').style.transform=`scale(${lerp(.92,1,k)})`;tx($('creditSub'),s.creditSub||'')}
 const cue=cues().find(c=>t>=c.start&&t<c.end);$('caption').style.display=cue&&captionOn&&!credit?'flex':'none';tx($('caption1'),cue?.text[0]||'');tx($('caption2'),cue?.text[1]||'');
 $('progress-mark').style.width=100*t/project.duration+'%';$('seek').value=frame;tx($('time'),t.toFixed(1)+' / '+project.duration+' s');$('chapters').value=s.start}
// Export always burns the validated cues (same data as the SRT); the HTML may switch to another subtitle pair.
function cues(){const v=project.variants[locale];return(!exporting&&track&&v.subtitle_tracks?.[track])||v.subtitles.cues}
// ---------- geometry for QA (stage pixels) ----------
function effOpacity(n){let o=1;for(let e=n;e&&e.id!=='svg';e=e.parentNode){if(e.style?.display==='none')return 0;const a=e.getAttribute?.('opacity');if(a!=null)o*=Number(a)}return o}
function boxOf(node,id,group){const r=node.getBoundingClientRect(),b=$('stage').getBoundingClientRect(),s=b.width/project.width;const o={id,x:(r.x-b.x)/s,y:(r.y-b.y)/s,width:r.width/s,height:r.height/s,container:'visual'};if(group)o.overlapGroup=group;return o}
function bounds(){const s=currentScene(frame/project.fps),list=[];if(s.section==='credit')return[];
 const add=(n,id,g)=>{if(n&&effOpacity(n)>.02&&n.getBoundingClientRect().width>0)list.push([n,id,g])};
 if(s.ladder){add(R.ladder.g,'ladder','ladder')}
 if(CHROME.has(s.kind)){add(R.chrome.banner,'task-banner');add(R.chrome.work,'workload')}
 const k=s.kind;
 if(k==='origin'){const O=R.origin;add(O.left,'chat-card');add(O.right,'agent-card');add(O.q,'question');add(O.news,'news-card');add(O.self,'self-rating');O.tags.forEach((x,i)=>add(x.t,'tag-'+i,'ladder'));add(O.stamp,'stamp')}
 if(k==='chat'){const K=R.chat;add(K.win,'chat-window','chat');add(K.user,'user-bubble','chat');add(K.ai,'ai-bubble','chat');add(K.youDo,'you-do');K.cards.forEach((c,i)=>add(c.c,'human-step-'+i))}
 if(k==='reason'){const Q=R.reason;add(Q.card,'reason-card','reason');add(Q.badge,'no-tool-badge','reason');Q.rows.forEach((r,i)=>add(r.row,'reason-row-'+i,'reason'));add(Q.quote,'quote','reason')}
 if(k==='agent'){const A=R.agent;A.chips.forEach((c,i)=>add(c.c,'plan-'+(i+1)));add(A.before,'level2-plan-only','browser');add(A.bWin,'browser','browser');add(A.robot,'agent-robot',A.robotGroup);add(A.hand,'human-cursor','browser')}
 if(k==='innovate'){const N=R.innovate;add(N.old,'old-process');add(N.bulb,'bulb');add(N.neu,'new-idea');add(N.sci,'science')}
 if(k==='organize'){const G=R.organize;add(G.frame,'org-frame','org');add(G.lead,'lead','org');G.boxes.forEach((x,i)=>add(x.c,'role-'+i,'org'));G.checks.forEach((c,i)=>add(c,'check-'+i,'org'))}
 if(k==='wrap'){const W=R.wrap;W.rows.forEach((r,i)=>add(r.r,'share-row-'+i));add(W.note,'note');add(W.leg,'legend')}
 if(k==='compare'){R.compare.cards.forEach((c,i)=>add(c.G,'card-'+i))}
 if(k==='apply'){const Y=R.apply;add(Y.card,'check-card','check');Y.rows.forEach((r,i)=>add(r.r,'q-'+i,'check'));add(Y.check,'checkpoints');add(R.ladder.pointer,'pointer','ladder');add(R.ladder.spanG,'span','ladder')}
 if(k==='outlook'){const U=R.outlook;add(U.tl,'timeline');add(U.l4,'level4-box');add(U.l5,'level5-box');add(U.pr,'problems')}
 return list.map(([n,id,g])=>boxOf(n,id,g))}
// ---------- playback / UI ----------
function scale(){if(!project)return;const s=exporting?1:Math.min(1,$('shell').clientWidth/project.width);$('stage').style.transform='scale('+s+')';$('viewport').style.width=project.width*s+'px';$('viewport').style.height=project.height*s+'px'}
function setAudio(){audio.pause();const mix=project.variants[locale].mix;audioReady=!!mix;if(mix)audio.src=new URL('../'+mix,location.href).href;else audio.removeAttribute('src');audio.load()}
function chapters(){const sel=$('chapters');sel.replaceChildren();for(const s of project.variants[locale].scenes){const o=document.createElement('option');o.value=s.start;o.textContent=s.chapter||s.title||s.screen;sel.append(o)}}
function tracks(){const v=project.variants[locale],sel=$('track');sel.replaceChildren();const names=Object.keys(v.subtitle_tracks||{});sel.hidden=names.length<2;
 for(const n of names){const o=document.createElement('option');o.value=n;o.textContent=(project.track_labels||{})[n]||n;sel.append(o)}const def=(project.default_tracks||{})[locale];if(names.length&&!names.includes(track))track=def&&names.includes(def)?def:names[0];if(names.length)sel.value=track}
async function loadFonts(){for(const a of project.font_assets||[]){const url=new URL('../'+a.url,location.href);const face=new FontFace(a.family,'url('+JSON.stringify(url.href)+')',{weight:a.weight||'400'});try{document.fonts.add(await face.load())}catch{throw Error('Required font could not load: '+a.family+' '+a.url)}}await document.fonts.ready}
async function seekToFrame(n,language=locale){if(!project.variants[language])throw Error('Unknown locale');if(language!==locale){locale=language;track=(project.default_tracks||{})[locale]||track;$('locale').value=locale;chapters();tracks();setAudio();interaction()}
 frame=Math.max(0,Math.min(Math.round(project.duration*project.fps)-1,Math.round(n)));draw();if(!exporting&&audioReady&&Math.abs(audio.currentTime-frame/project.fps)>.15)audio.currentTime=frame/project.fps;return frame}
function pause(){playing=false;audio.pause();$('play').textContent=ui('pause')}
async function play(){if(frame>=project.duration*project.fps-1)await seekToFrame(0);playing=true;last=performance.now();$('play').textContent=ui('pauseBtn');if(audioReady){audio.currentTime=frame/project.fps;try{await audio.play()}catch{pause();$('feedback').textContent=ui('audioFail');return}}requestAnimationFrame(tick)}
function tick(now){if(!playing)return;const next=audioReady?Math.floor(audio.currentTime*project.fps):frame+(now-last)*project.fps/1000;last=now;if(next>=project.duration*project.fps){seekToFrame(project.duration*project.fps-1);pause();return}frame=next;draw();requestAnimationFrame(tick)}
audio.addEventListener('ended',()=>{if(playing){seekToFrame(project.duration*project.fps-1);pause()}});
const UI={'zh-TW':{pause:'播放',pauseBtn:'暫停',replay:'重播',capOn:'字幕開啟',capOff:'字幕關閉',audioFail:'音軌無法播放，請檢查音檔或瀏覽器權限。'},'en-US':{pause:'Play',pauseBtn:'Pause',replay:'Replay',capOn:'Captions on',capOff:'Captions off',audioFail:'The soundtrack could not play; check the audio file or browser permissions.'}};
const ui=k=>UI[locale][k];
function interaction(){const ix=(project.interaction||{})[locale];if(!ix)return;$('ixTitle').textContent=ix.title;$('ixLabel').textContent=ix.label;$('note').textContent=ix.note||'';
 $('replay').textContent=ui('replay');$('captions').textContent=captionOn?ui('capOn'):ui('capOff');if(!playing)$('play').textContent=ui('pause');levelFeedback();quiz()}
function levelFeedback(){const ix=project.interaction?.[locale];if(!ix)return;const n=Number($('delay').value);$('ixLevel').textContent=ix.levelNames[n-1];$('ixLevel').style.color=DARK[n-1];$('feedback').textContent=ix.levels[n-1]}
function quiz(){const ix=project.interaction?.[locale],box=$('quiz');if(!ix?.quiz){box.hidden=true;return}box.hidden=false;box.replaceChildren();
 ix.quiz.forEach(q=>{const item=document.createElement('div');item.className='qitem';const p=document.createElement('p');p.className='q';p.textContent=q.q;const o=document.createElement('div');o.className='opts';
  const f=document.createElement('p');f.className='qfb';f.setAttribute('role','status');
  for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent=ix.levelNames[i-1];b.onclick=()=>{f.textContent=i===q.a?ix.right+' '+q.why:ix.wrong+' '+ix.hint;f.style.color=i===q.a?'#18855a':RED};o.append(b)}item.append(p,o,f);box.append(item)})}
window.lesson={ready:async()=>{await loaded;await document.fonts.ready},seekToFrame,bounds,getProject:()=>project};
const loaded=(async()=>{const res=await fetch(params.get('project')||'../project.json');if(!res.ok)throw Error('Cannot load project.json');project=await res.json();if(!project.variants[locale])throw Error('Unknown locale');
 await loadFonts();$('stage').style.width=project.width+'px';$('stage').style.height=project.height+'px';$('seek').max=Math.round(project.duration*project.fps)-1;$('locale').value=locale;
 document.title=project.title;chapters();tracks();setAudio();scale();interaction();await seekToFrame(0)})();
$('play').onclick=()=>playing?pause():play();$('replay').onclick=async()=>{pause();await seekToFrame(0);await play()};$('seek').oninput=()=>{pause();seekToFrame(Number($('seek').value))};
$('locale').onchange=()=>{pause();seekToFrame(frame,$('locale').value)};$('track').onchange=()=>{track=$('track').value;draw()};$('chapters').onchange=()=>{pause();seekToFrame(Number($('chapters').value)*project.fps)};
$('captions').onclick=()=>{captionOn=!captionOn;$('captions').textContent=captionOn?ui('capOn'):ui('capOff');$('captions').setAttribute('aria-pressed',String(captionOn));draw()};
$('delay').oninput=levelFeedback;window.addEventListener('resize',scale);
</script>
</html>
